<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASLS 시간표 연동 데모 (메드소프트 참고용)</title>
<!--
  이 페이지는 "공개 데이터 피드(asls-agenda-public.js)"를 받아 홈페이지 표 디자인으로
  그리는 방법을 보여주는 참고 예시입니다. 메드소프트는 아래 render()/openSpeaker()
  부분만 자사 홈페이지 디자인에 맞게 바꾸면 됩니다.
  (데이터 가져오기·시간계산·국문영문·연자 사진/국적 처리는 라이브러리가 담당)

  주소:  agenda-feed-demo.html?id=<행사ID>[&lang=ko|en]

  포함 시연:
   - 룸 이름(헤더) + 주제(부제) 분리 표시
   - 국문/영문 버튼 (영문 없으면 국문 자동 폴백)
   - 연자 사진(이름 좌측) + 소속/국적
   - 파트너사·제품 미표시(공개 피드에서 제외)
   - 연자 이름 클릭 → 해당 연자의 강의목록 표시
-->
<style>
  :root { --p: #6b1f7a; --p2: #3f1147; --line: #e7e2ea; --dim: #7a7580; --text: #222; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Malgun Gothic", "Noto Sans KR", sans-serif; color: var(--text); background: #fff; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 20px 16px 60px; }
  .hint { background: #faf5fc; border: 1px solid #ecdbf2; color: #5a3a66; font-size: 0.82rem; border-radius: 10px; padding: 10px 14px; margin-bottom: 18px; }
  .seg { display: inline-flex; gap: 6px; margin-left: 10px; }
  .seg a { font-size: 0.8rem; text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; color: var(--p2); }
  .seg a.on { background: var(--p); color: #fff; border-color: var(--p); }
  .day-h { font-size: 1.15rem; font-weight: 800; color: var(--p2); margin: 26px 0 12px; }
  /* 룸은 박스 밖으로 꺼낸 '제목' 형태 — 세션과 혼동되지 않게 */
  .room { margin-bottom: 34px; }
  .room-head { padding: 4px 2px 12px; margin-bottom: 14px; border-bottom: 2px solid var(--p); }
  .room-name { font-size: 1.55rem; font-weight: 800; color: var(--p2); letter-spacing: .2px; }
  .room-topic { font-size: 1.2rem; font-weight: 700; color: var(--p); margin-top: 3px; }
  /* 세션은 진한 보라 헤더의 카드 (룸 안에 여러 개) */
  .sess { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
  .sess-head { background: linear-gradient(90deg, var(--p), var(--p2)); color: #fff; padding: 13px 20px; font-weight: 800; font-size: 1.02rem; }
  .sess-time { font-weight: 600; color: rgba(255,255,255,.9); font-size: 0.85rem; margin-left: 8px; }
  .sess-mod { font-weight: 500; color: rgba(255,255,255,.92); font-size: 0.82rem; margin-top: 3px; }
  table { width: 100%; border-collapse: collapse; }
  thead th { text-align: left; font-size: 0.9rem; color: var(--p2); background: #f3ebf6; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  tbody td { padding: 14px 20px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 0.92rem; }
  tbody tr:last-child td { border-bottom: 0; }
  .l-title { font-weight: 700; line-height: 1.4; }
  .l-sub { color: var(--dim); font-size: 0.84rem; margin-top: 2px; }
  .l-memo { display: inline-block; margin-top: 5px; font-size: 0.8rem; color: #92400e; background: #fffbeb; border: 1px solid #fde68a; border-radius: 6px; padding: 2px 8px; }
  .spk { display: inline-flex; align-items: center; gap: 8px; }
  .spk img, .spk .noimg { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: #ece7f0; flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; color: var(--p2); font-weight: 700; font-size: 0.9rem; }
  .spk-name { color: var(--p); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .aff { color: var(--dim); }
  .break-row td { background: #faf7fb; color: var(--dim); font-weight: 600; }
  .col-time { width: 120px; white-space: nowrap; color: var(--dim); font-variant-numeric: tabular-nums; }
  .col-spk { width: 250px; }
  .col-aff { width: 200px; }
  .msg { padding: 48px 16px; text-align: center; color: var(--dim); }
  /* 연자 강의목록 팝업 */
  .ov { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .ov.on { display: flex; }
  .ov-card { background: #fff; border-radius: 14px; max-width: 560px; width: 100%; max-height: 85vh; overflow: auto; padding: 22px; }
  .ov-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .ov-head img, .ov-head .noimg { width: 54px; height: 54px; border-radius: 50%; object-fit: cover; background: #ece7f0; display: inline-flex; align-items: center; justify-content: center; color: var(--p2); font-weight: 700; }
  .ov-name { font-size: 1.15rem; font-weight: 800; }
  .ov-aff { color: var(--dim); font-size: 0.88rem; }
  .ov-lec { border-top: 1px solid var(--line); padding: 12px 0; }
  .ov-lec-time { color: var(--p); font-weight: 700; font-size: 0.82rem; }
  .ov-lec-title { font-weight: 600; margin-top: 2px; }
  .ov-lec-room { color: var(--dim); font-size: 0.8rem; margin-top: 2px; }
  .ov-close { float: right; border: 0; background: #f0ecf3; border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 700; }
  @media (max-width: 760px) {
    .col-spk, .col-aff, .col-time { width: auto; }
    thead { display: none; }
    tbody td { display: block; border: 0; padding: 4px 18px; }
    tbody tr { border-bottom: 1px solid var(--line); display: block; padding: 10px 0; }
    .col-time { padding-top: 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="hint">
    <b>메드소프트 참고용 데모</b> — 공개 데이터 피드를 받아 표로 그리는 예시입니다.
    데이터 가져오기·시간계산·국문영문·연자 사진/국적 처리는 <code>asls-agenda-public.js</code>가 담당하며,
    홈페이지는 <code>render()</code>만 자사 디자인으로 바꾸면 됩니다.
    <span class="seg" id="langSeg"></span>
  </div>
  <div id="app"><div class="msg">불러오는 중…</div></div>
</div>

<div class="ov" id="spkOverlay" onclick="if(event.target===this)closeSpeaker()">
  <div class="ov-card" id="spkCard"></div>
</div>

<script src="js/asls-agenda-public.js"></script>
<script>
  var params = new URLSearchParams(location.search);
  var CONF_ID = params.get('id') || '';
  var LANG = params.get('lang') === 'en' ? 'en' : 'ko';
  var SPK_INDEX = {};   // 연자 이름 → 강의목록 (연자 클릭용)

  function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
  // 영문 버튼이어도 영문 값이 없으면 국문으로 자동 폴백
  function pick(ko, en) { return LANG === 'en' ? (en || ko || '') : (ko || en || ''); }
  function fmtDay(d) {
    if (!d) return '';
    var wd = ['일', '월', '화', '수', '목', '금', '토'];
    var dt = new Date(d + 'T00:00:00'); if (isNaN(dt)) return d;
    return LANG === 'en' ? d : dt.getFullYear() + '. ' + (dt.getMonth() + 1) + '. ' + dt.getDate() + ' (' + wd[dt.getDay()] + ')';
  }
  function avatar(photo, name, cls) {
    if (photo) return '<img src="' + esc(photo) + '" alt="" class="' + (cls || '') + '">';
    var ch = (name || '?').charAt(0);
    return '<span class="noimg ' + (cls || '') + '">' + esc(ch) + '</span>';
  }

  /* ====== 이 render()만 홈페이지 디자인에 맞게 교체하면 됩니다 ====== */
  function render(feed) {
    var app = document.getElementById('app');
    document.getElementById('langSeg').innerHTML =
      '<a href="?id=' + esc(CONF_ID) + '&lang=ko" class="' + (LANG === 'ko' ? 'on' : '') + '">국문</a>' +
      '<a href="?id=' + esc(CONF_ID) + '&lang=en" class="' + (LANG === 'en' ? 'on' : '') + '">EN</a>';

    // 연자 클릭용 인덱스 구성
    SPK_INDEX = {};
    AslsAgenda.speakerIndex(feed).forEach(function (s) {
      SPK_INDEX[(s.name || s.nameEn || '').trim()] = s;
      if (s.nameEn) SPK_INDEX[s.nameEn.trim()] = s;
    });

    if (!feed.days.length) { app.innerHTML = '<div class="msg">등록된 프로그램이 없습니다.</div>'; return; }
    var html = '';
    feed.days.forEach(function (day) {
      html += '<div class="day-h">' + esc(fmtDay(day.date)) + '</div>';
      day.rooms.forEach(function (room) {
        var topic = pick(room.topic, room.topicEn);
        html += '<div class="room"><div class="room-head">' +
          '<div class="room-name">' + esc(pick(room.name, room.nameEn)) + '</div>' +
          (topic ? '<div class="room-topic">' + esc(topic) + '</div>' : '') + '</div>';
        room.sessions.forEach(function (s) {
          html += '<div class="sess">';
          if (!room.sessionless) {
            var mod = s.moderators.length
              ? '<div class="sess-mod">' + (LANG === 'en' ? 'Moderator' : '좌장') + ': ' +
                s.moderators.map(function (m) {
                  var aff = pick(m.affiliation, m.affiliationEn);
                  return esc(pick(m.name, m.nameEn)) + (aff ? ' (' + esc(aff) + ')' : '');
                }).join(', ') + '</div>' : '';
            html += '<div class="sess-head">' + esc(pick(s.name, s.nameEn) || (LANG === 'en' ? 'Session' : '세션')) +
              '<span class="sess-time">' + s.start + ' - ' + s.end + '</span>' + mod + '</div>';
          }
          html += '<table><thead><tr>' +
            '<th class="col-time">' + (LANG === 'en' ? 'Time' : '시간') + '</th>' +
            '<th>' + (LANG === 'en' ? 'Lecture Title' : '강의 제목') + '</th>' +
            '<th class="col-spk">' + (LANG === 'en' ? 'Speaker' : '연자') + '</th>' +
            '<th class="col-aff">' + (LANG === 'en' ? 'Affiliation' : '소속') + '</th>' +
            '</tr></thead><tbody>';
          s.lectures.forEach(function (lec) {
            if (lec.type !== 'lecture') {
              html += '<tr class="break-row"><td class="col-time">' + lec.start + ' - ' + lec.end + '</td>' +
                '<td colspan="3">' + esc(pick(lec.title, lec.titleEn) || (lec.type === 'panel' ? 'Panel Discussion' : 'Break')) + '</td></tr>';
              return;
            }
            var subtitle = LANG === 'en' ? lec.title : lec.titleEn;
            var spk = lec.speakers.map(function (x) {
              var nm = esc(pick(x.name, x.nameEn));
              return '<span class="spk">' + avatar(x.photo, pick(x.name, x.nameEn)) +
                '<span class="spk-name" onclick="openSpeaker(\'' + esc((x.name || x.nameEn || '').replace(/'/g, "\\'")) + '\')">' + nm + '</span></span>';
            }).join('<br>') || '-';
            var aff = lec.speakers.map(function (x) { return esc(pick(x.affiliation, x.affiliationEn)); }).filter(Boolean).join(', ') || '-';
            html += '<tr><td class="col-time">' + lec.start + ' - ' + lec.end + '</td>' +
              '<td><div class="l-title">' + esc(pick(lec.title, lec.titleEn)) + '</div>' +
              (subtitle ? '<div class="l-sub">' + esc(subtitle) + '</div>' : '') +
              (lec.memo ? '<div class="l-memo">📝 ' + esc(lec.memo) + '</div>' : '') + '</td>' +
              '<td class="col-spk">' + spk + '</td>' +
              '<td class="col-aff"><span class="aff">' + aff + '</span></td></tr>';
          });
          html += '</tbody></table>';
          html += '</div>';
        });
        html += '</div>';
      });
    });
    app.innerHTML = html;
  }

  /* ====== 연자 클릭 → 해당 연자의 강의목록 (이 부분도 홈페이지 디자인으로 교체 가능) ====== */
  window.openSpeaker = function (name) {
    var s = SPK_INDEX[(name || '').trim()];
    if (!s) return;
    var html = '<button class="ov-close" onclick="closeSpeaker()">닫기 ✕</button>' +
      '<div class="ov-head">' + avatar(s.photo, pick(s.name, s.nameEn)) +
      '<div><div class="ov-name">' + esc(pick(s.name, s.nameEn)) + '</div>' +
      '<div class="ov-aff">' + esc(pick(s.affiliation, s.affiliationEn)) + '</div></div></div>' +
      '<div style="font-weight:700;color:var(--p2);margin-bottom:4px">' + (LANG === 'en' ? 'Lectures' : '강의 목록') + ' (' + s.lectures.length + ')</div>' +
      s.lectures.map(function (l) {
        return '<div class="ov-lec"><div class="ov-lec-time">' + esc(fmtDay(l.date)) + ' · ' + l.start + ' - ' + l.end + '</div>' +
          '<div class="ov-lec-title">' + esc(pick(l.title, l.titleEn)) + '</div>' +
          '<div class="ov-lec-room">' + esc(pick(l.room, l.roomEn)) + (l.session ? ' · ' + esc(pick(l.session, l.sessionEn)) : '') + '</div></div>';
      }).join('');
    document.getElementById('spkCard').innerHTML = html;
    document.getElementById('spkOverlay').classList.add('on');
  };
  window.closeSpeaker = function () { document.getElementById('spkOverlay').classList.remove('on'); };

  if (!CONF_ID) {
    document.getElementById('app').innerHTML = '<div class="msg">주소에 <code>?id=행사ID</code>가 필요합니다.</div>';
  } else {
    AslsAgenda.load(CONF_ID).then(render).catch(function (e) {
      document.getElementById('app').innerHTML = '<div class="msg">데이터를 불러오지 못했습니다.<br>' + esc(e.message) + '</div>';
    });
  }
</script>
</body>
</html>
