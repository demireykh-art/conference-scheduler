<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학술대회 프로그램 · ASLS</title>
    <link rel="icon" type="image/png" href="admin/assets/asls-logo.png">
    <meta property="og:title" content="학술대회 프로그램 · ASLS">
    <meta property="og:description" content="ASLS 학술대회 시간표 · 프로그램">
    <meta name="theme-color" content="#6E2B7B">
    <style>
        :root {
            --p: #6b1f7a; --p2: #3f1147;
            --ink: #1f2430; --dim: #7a7580;
            --line: #e7e2ea; --soft: #f5f6f8; --break: #faf7fb;
        }
        * { box-sizing: border-box; }
        html { font-size: 17.5px; }
        html, body { margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
            color: var(--ink); background: #fff; line-height: 1.5;
            -webkit-text-size-adjust: 100%;
            overflow-x: hidden;
        }
        .ag-container { max-width: 100%; margin: 0 auto; padding: 16px 10px 32px; }

        /* 헤더 */
        .ag-head { margin-bottom: 16px; }
        .ag-title { font-size: 1.55rem; font-weight: 800; margin: 0 0 4px; color: var(--p); }
        .ag-range { color: var(--dim); font-size: 0.95rem; margin-bottom: 14px; }
        .ag-controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

        /* 탭 (날짜 / 룸) — pill 형태 */
        .ag-tabs { display: flex; flex-wrap: wrap; gap: 9px; }
        .ag-tab { border: 1px solid var(--line); border-radius: 999px; padding: 8px 17px; font-weight: 700;
                  color: var(--p2); background: #fff; cursor: pointer; font-size: 0.92rem; font-family: inherit; }
        .ag-tab:hover { border-color: var(--p); }
        .ag-tab.on { background: var(--p2); color: #fff; border-color: var(--p2); }
        .ag-tabs.rooms { margin-top: 10px; }
        .ag-tabs.rooms .ag-tab { padding: 7px 15px; font-size: 0.9rem; }

        .ag-lang { margin-left: auto; display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
        .ag-lang button { border: 0; background: #fff; padding: 8px 14px; font-size: 0.86rem; cursor: pointer;
                          color: var(--dim); border-left: 1px solid var(--line); font-family: inherit; }
        .ag-lang button:first-child { border-left: 0; }
        .ag-lang button.on { background: var(--p); color: #fff; font-weight: 700; }

        .ag-divider { border: 0; border-top: 1px solid var(--line); margin: 14px 0 18px; }

        /* 선택된 룸: 주제(큰 제목) + 세션들 */
        .ag-topic { font-size: 1.5rem; font-weight: 800; color: var(--p2); letter-spacing: .2px; margin: 4px 0 16px; }

        .ag-sess { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
        .ag-sess-head { background: linear-gradient(90deg, var(--p), var(--p2)); color: #fff; padding: 12px 18px; }
        .ag-sess-name { font-weight: 800; font-size: 1.02rem; }
        .ag-sess-time { font-weight: 600; color: rgba(255,255,255,.9); font-size: 0.85rem; margin-left: 8px; }
        .ag-sess-mod { font-weight: 500; color: rgba(255,255,255,.92); font-size: 0.83rem; margin-top: 3px; }

        /* 상단 안내(즐겨찾기) 배너 */
        .ag-note { background: #f6eff8; border: 1px solid #e6d6ee; color: #5a2a66; border-radius: 10px;
                   padding: 11px 14px; font-size: 0.92rem; font-weight: 700; margin: 12px 0 2px; line-height: 1.5; }
        .ag-note .cnt { color: var(--p); }

        /* 강의 목록 (표 대신 플렉스 행 — 좌우 스크롤 없음) */
        .lec { display: flex; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); align-items: flex-start; }
        .lec:first-child { border-top: 0; }
        .lec-time { flex: 0 0 92px; color: var(--p2); font-variant-numeric: tabular-nums; font-size: 0.86rem;
                    font-weight: 700; padding-top: 2px; white-space: nowrap; }
        .lec-body { flex: 1 1 auto; min-width: 0; }
        .l-title { font-weight: 700; line-height: 1.4; overflow-wrap: anywhere; word-break: break-word; }
        .lec-people { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 5px 14px; align-items: center; }
        .spk { display: inline-flex; align-items: center; gap: 7px; }
        .spk img, .spk .noimg { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; background: #ece7f0;
                                flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
                                color: var(--p2); font-weight: 700; font-size: 0.78rem; }
        .spk-name { color: var(--p); font-weight: 600; }
        a.spk-name { cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
        .spk-aff { color: var(--dim); font-size: 0.9rem; }
        .l-memo { display: inline-block; margin-top: 6px; font-size: 0.82rem; color: #92400e; background: #fffbeb;
                  border: 1px solid #fde68a; border-radius: 6px; padding: 2px 8px; white-space: pre-wrap; word-break: break-word; }
        /* 담기(즐겨찾기) 버튼 */
        .fav { flex: 0 0 auto; border: 1px solid var(--line); background: #fff; border-radius: 999px;
               padding: 6px 12px; cursor: pointer; color: var(--dim); font-weight: 700; font-size: 0.84rem;
               display: inline-flex; align-items: center; gap: 5px; font-family: inherit; white-space: nowrap; }
        .fav:hover { border-color: var(--p); color: var(--p); }
        .fav.on { background: #fff6db; border-color: #f2c94c; color: #b7791f; }
        .fav .star { font-size: 0.98rem; line-height: 1; }
        .lec-break { display: flex; gap: 12px; padding: 11px 16px; border-top: 1px solid var(--line);
                     background: var(--break); color: var(--p); font-weight: 700; }
        .lec-break .lec-time { color: var(--p); }

        .ag-msg { text-align: center; padding: 48px 16px; color: var(--dim); }
        .ag-msg-t { font-size: 1.05rem; font-weight: 700; margin-bottom: 6px; color: var(--ink); }
        .ag-msg code { background: var(--soft); padding: 1px 6px; border-radius: 5px; }

        @media (max-width: 760px) {
            .ag-container { padding-left: 8px; padding-right: 8px; }
            .ag-title { font-size: 1.35rem; }
            .ag-controls { flex-direction: column; align-items: flex-start; gap: 10px; }
            .ag-lang { margin-left: 0; }
            .ag-sess-name { display: block; }
            .ag-sess-time { margin-left: 0; }
            .lec { flex-wrap: wrap; padding: 12px 14px; }
            .lec-time { flex-basis: auto; order: 1; }
            .fav { order: 2; margin-left: auto; }
            .lec-body { order: 3; flex-basis: 100%; }
        }
    </style>
</head>
<body>
    <div class="ag-container">
        <div id="agenda"><div class="ag-msg"><div class="ag-msg-t">불러오는 중…</div></div></div>
    </div>

    <script src="js/asls-agenda-public.js"></script>
    <script>
    (function () {
        var params = new URLSearchParams(location.search);
        var CONF_ID = params.get('id') || '';
        var LANG = params.get('lang') === 'en' ? 'en' : 'ko';   // 'ko' | 'en' (기본 국문)
        var DATE = params.get('date') || '';            // 특정 날짜만
        // 연자 클릭 시 이동할 초청연자 페이지 URL 템플릿 ({id} 자리에 연자 고유 id)
        var SPK_BASE = params.get('spkbase') || 'https://www.asls.kr/html/?pmode=invited&speaker={id}';
        var FEED = null;
        var SEL = { day: 0, room: 0 };

        var $ = function (id) { return document.getElementById(id); };
        function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }

        var WD_KO = ['일', '월', '화', '수', '목', '금', '토'];
        var WD_EN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        var MON_EN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        function fmtDayShort(d, lang) {
            var dt = new Date(d + 'T00:00:00'); if (isNaN(dt)) return d;
            if (lang === 'en') return MON_EN[dt.getMonth()] + ' ' + dt.getDate() + ' (' + WD_EN[dt.getDay()] + ')';
            var p = function (n) { return String(n).padStart(2, '0'); };
            return p(dt.getMonth() + 1) + '/' + p(dt.getDate()) + '(' + WD_KO[dt.getDay()] + ')';
        }
        function fmtDayLong(d, lang) {
            var dt = new Date(d + 'T00:00:00'); if (isNaN(dt)) return d;
            if (lang === 'en') return MON_EN[dt.getMonth()] + ' ' + dt.getDate() + ', ' + dt.getFullYear() + ' (' + WD_EN[dt.getDay()] + ')';
            return dt.getFullYear() + '. ' + (dt.getMonth() + 1) + '. ' + dt.getDate() + ' (' + WD_KO[dt.getDay()] + ')';
        }
        // 헤더 언어(룸 문맥 없음): auto면 국문
        function hLang() { return LANG === 'en' ? 'en' : 'ko'; }
        // 룸 문맥 언어: 선택한 언어(국문/EN) 그대로 사용
        function rLang(room) { return LANG === 'en' ? 'en' : 'ko'; }
        function pick(lang, ko, en) { return lang === 'en' ? (en || ko || '') : (ko || en || ''); }

        function avatar(photo, name) {
            if (photo) return '<img src="' + esc(photo) + '" alt="">';
            return '<span class="noimg">' + esc((name || '?').charAt(0)) + '</span>';
        }

        function activeDays() {
            var days = (FEED && FEED.days) || [];
            if (DATE) return days.filter(function (d) { return d.date === DATE; });
            return days;
        }

        /* ---------- 관심강의(담기) 저장 ---------- */
        // 임베드에서는 브라우저(localStorage)에 저장하는 데모 동작입니다.
        // 홈페이지(메드소프트)에서는 회원 로그인에 연결해 회원별로 저장하세요.
        var FAVKEY = 'asls_fav_' + CONF_ID;
        function getFavs() { try { return JSON.parse(localStorage.getItem(FAVKEY) || '[]'); } catch (e) { return []; } }
        function isFav(id) { return id && getFavs().indexOf(id) >= 0; }

        window.AGENDA = {
            setLang: function (l) { LANG = l; render(); },
            selDay: function (i) { SEL.day = i; SEL.room = 0; render(); },
            selRoom: function (i) { SEL.room = i; render(); },
            toggleFav: function (id) {
                if (!id) return;
                var f = getFavs(), i = f.indexOf(id);
                if (i >= 0) f.splice(i, 1); else f.push(id);
                try { localStorage.setItem(FAVKEY, JSON.stringify(f)); } catch (e) { }
                render();
            }
        };

        function msg(t, sub) { return '<div class="ag-msg"><div class="ag-msg-t">' + t + '</div>' + (sub ? '<div>' + sub + '</div>' : '') + '</div>'; }

        function render() {
            var wrap = $('agenda');
            if (!CONF_ID) { wrap.innerHTML = msg('행사 정보가 없습니다.', '주소에 <code>?id=행사ID</code> 가 필요합니다.'); postHeight(); return; }
            if (!FEED) { wrap.innerHTML = msg('프로그램을 불러오는 중…', ''); postHeight(); return; }

            var days = activeDays();
            if (!days.length) {
                var why = (FEED._roomsTotal === 0)
                    ? '이 행사에 룸이 없거나 데이터를 읽지 못했습니다.'
                    : '표시할 프로그램이 없습니다. (공개된 룸 ' + FEED._roomsPublic + '개)';
                wrap.innerHTML = msg('프로그램이 없습니다.', why); postHeight(); return;
            }

            if (SEL.day >= days.length) SEL.day = 0;
            var day = days[SEL.day];
            if (SEL.room >= day.rooms.length) SEL.room = 0;
            var room = day.rooms[SEL.room];

            // 헤더
            var hl = hLang();
            var title = pick(hl, FEED.title, FEED.titleEn) || '학술대회 프로그램';
            var range = FEED.startDate ? (FEED.endDate && FEED.endDate !== FEED.startDate ? FEED.startDate + ' ~ ' + FEED.endDate : FEED.startDate) : '';
            var favN = getFavs().length;
            var note = (hl === 'en'
                ? '⭐ Tap “Save” on a lecture to build your own schedule.'
                : '⭐ 강의 옆 <b>‘담기’</b> 버튼으로 나만의 강의 스케줄을 만들어 보세요.')
                + (favN ? ' <span class="cnt">(' + (hl === 'en' ? 'saved ' + favN : '담은 강의 ' + favN + '개') + ')</span>' : '');

            var html = '<div class="ag-head">' +
                '<h1 class="ag-title">' + esc(title) + '</h1>' +
                (range ? '<div class="ag-range">' + esc(range) + '</div>' : '') +
                '<div class="ag-note">' + note + '</div>' +
                '<div class="ag-controls">' +
                    '<div class="ag-tabs days">' + days.map(function (d, i) {
                        return '<button class="ag-tab ' + (i === SEL.day ? 'on' : '') + '" onclick="AGENDA.selDay(' + i + ')">' + esc(fmtDayShort(d.date, hl)) + '</button>';
                    }).join('') + '</div>' +
                    '<div class="ag-lang">' +
                        '<button class="' + (LANG === 'ko' ? 'on' : '') + '" onclick="AGENDA.setLang(\'ko\')">국문</button>' +
                        '<button class="' + (LANG === 'en' ? 'on' : '') + '" onclick="AGENDA.setLang(\'en\')">EN</button>' +
                    '</div>' +
                '</div>' +
            '</div>';

            // 룸 탭 (룸 이름 — 본문엔 반복 안 함)
            var rl = rLang(room);
            html += '<div class="ag-tabs rooms">' + day.rooms.map(function (r, i) {
                var rll = rLang(r);
                return '<button class="ag-tab ' + (i === SEL.room ? 'on' : '') + '" onclick="AGENDA.selRoom(' + i + ')">' + esc(pick(rll, r.name, r.nameEn) || '룸') + '</button>';
            }).join('') + '</div><hr class="ag-divider">';

            // 선택된 룸: 주제(큰 제목) + 세션들
            var topic = pick(rl, room.topic, room.topicEn);
            if (topic) html += '<div class="ag-topic">' + esc(topic) + '</div>';

            var bodyHtml = '';
            room.sessions.forEach(function (s) {
                // 강의가 하나도 없는 (빈) 세션은 표시하지 않음
                if (!room.sessionless && (!s.lectures || !s.lectures.length)) return;
                bodyHtml += renderSession(room, s, rl);
            });
            if (!bodyHtml) bodyHtml = '<div class="ag-msg"><div>' + (rl === 'en' ? 'No sessions yet.' : '등록된 세션이 없습니다.') + '</div></div>';
            html += bodyHtml;

            wrap.innerHTML = html;
            postHeight();
        }

        function renderSession(room, s, lang) {
            var head = '';
            if (!room.sessionless) {
                var mod = s.moderators && s.moderators.length
                    ? '<div class="ag-sess-mod">' + (lang === 'en' ? 'Moderator' : '좌장') + ': ' +
                        s.moderators.map(function (m) {
                            var aff = pick(lang, m.affiliation, m.affiliationEn);
                            return esc(pick(lang, m.name, m.nameEn)) + (aff ? ' (' + esc(aff) + ')' : '');
                        }).join(', ') + '</div>' : '';
                head = '<div class="ag-sess-head">' +
                    '<span class="ag-sess-name">' + esc(pick(lang, s.name, s.nameEn) || (lang === 'en' ? 'Session' : '세션')) + '</span>' +
                    '<span class="ag-sess-time">' + s.start + ' – ' + s.end + '</span>' + mod + '</div>';
            }
            var rows = s.lectures.map(function (lec) { return renderLecture(lec, lang); }).join('') ||
                ('<div class="ag-msg"><div>' + (lang === 'en' ? 'No lectures.' : '강의가 없습니다.') + '</div></div>');
            return '<div class="ag-sess">' + head + rows + '</div>';
        }

        function renderLecture(lec, lang) {
            var time = lec.start + ' – ' + lec.end;
            if (lec.type !== 'lecture') {
                var t = pick(lang, lec.title, lec.titleEn) || (lec.type === 'panel' ? 'Panel Discussion' : (lang === 'en' ? 'Break' : '행사'));
                return '<div class="lec-break"><div class="lec-time">' + time + '</div><div class="lec-body"><div class="l-title">' + esc(t) + '</div></div></div>';
            }
            var title = esc(pick(lang, lec.title, lec.titleEn) || (lang === 'en' ? '(Untitled)' : '(제목 없음)'));
            // 연자·소속: 강의 제목 아래 둘째 줄 (좌우 스크롤 없이 한 화면에)
            var spks = lec.speakers || [];
            var peopleHtml = spks.map(function (x) {
                var nm = esc(pick(lang, x.name, x.nameEn));
                var aff = esc(pick(lang, x.affiliation, x.affiliationEn));
                var inner = avatar(x.photo, pick(lang, x.name, x.nameEn));
                if (x.id && SPK_BASE) {
                    var href = SPK_BASE.replace('{id}', encodeURIComponent(x.id));
                    inner += '<a class="spk-name" href="' + esc(href) + '" target="_top">' + nm + '</a>';
                } else {
                    inner += '<span class="spk-name">' + nm + '</span>';
                }
                if (aff) inner += '<span class="spk-aff">' + aff + '</span>';
                return '<span class="spk">' + inner + '</span>';
            }).join('');
            var on = isFav(lec.id);
            var favBtn = lec.id ? ('<button class="fav ' + (on ? 'on' : '') + '" title="관심강의 담기 — 나만의 스케줄 만들기" onclick="AGENDA.toggleFav(\'' + lec.id + '\')">' +
                '<span class="star">' + (on ? '★' : '☆') + '</span>' + (on ? (lang === 'en' ? 'Saved' : '담김') : (lang === 'en' ? 'Save' : '담기')) + '</button>') : '';
            return '<div class="lec">' +
                '<div class="lec-time">' + time + '</div>' +
                '<div class="lec-body">' +
                    '<div class="l-title">' + title + '</div>' +
                    (peopleHtml ? '<div class="lec-people">' + peopleHtml + '</div>' : '') +
                    (lec.memo ? '<div class="l-memo">📝 ' + esc(lec.memo) + '</div>' : '') +
                '</div>' +
                favBtn +
            '</div>';
        }

        /* ---------- iframe 높이 자동 전달 ---------- */
        function postHeight() {
            try { parent.postMessage({ type: 'asls-agenda-height', id: CONF_ID, height: document.documentElement.scrollHeight }, '*'); } catch (e) { }
        }
        window.addEventListener('resize', postHeight);
        window.addEventListener('load', postHeight);
        if (window.ResizeObserver) { try { new ResizeObserver(postHeight).observe(document.body); } catch (e) { } }

        /* ---------- 로드 + 주기적 갱신 ---------- */
        function load() {
            AslsAgenda.load(CONF_ID).then(function (feed) {
                FEED = feed; render();
            }).catch(function (e) {
                $('agenda').innerHTML = msg('프로그램을 불러올 수 없습니다.', '잠시 후 다시 시도해 주세요.');
                postHeight();
            });
        }
        if (!CONF_ID) { render(); }
        else {
            load();
            setInterval(load, 60000);   // 60초마다 자동 갱신(스케줄러 수정사항 반영)
        }
    })();
    </script>
</body>
</html>
