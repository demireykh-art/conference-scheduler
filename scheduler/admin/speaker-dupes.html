<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/asls-logo.png">
    <title>중복 연자 점검 · ASLS 행사 관리</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <div id="sidebarMount"></div>
        <main class="main">
            <div class="main-topbar">
                <div style="display:flex;align-items:center;gap:10px">
                    <button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
                    <h1 class="main-title">중복 연자 점검</h1>
                </div>
                <div style="display:flex;gap:8px">
                    <button class="btn" onclick="exportSpeakersBackup()" title="통합·삭제 전에 연자 전체를 JSON으로 저장(안전용)">💾 연자 백업</button>
                    <button class="btn" onclick="reloadAll()">🔄 새로고침</button>
                </div>
            </div>
            <div class="main-body">
                <div class="info-banner">
                    <div class="info-ico">i</div>
                    <div class="info-title">같은 이름으로 <b>중복 등록된 연자</b>를 찾아, 각 레코드에 <b>어떤 강의·좌장이 연결(매칭)되어 있는지</b>를 보여줍니다.
                        <b>이 연자로 통합</b>을 누르면 나머지 중복의 강의·좌장을 그 연자로 <b>옮긴 뒤</b> 중복을 삭제하므로 강의가 끊기지 않습니다.
                        (전체 행사 데이터를 기준으로 집계합니다.)</div>
                </div>

                <div class="toolbar-row" style="margin:14px 0 4px">
                    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
                        <input type="text" id="dupSearch" placeholder="🔍 이름으로 찾기" style="padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:0.86rem;width:220px">
                        <label class="check-inline" style="font-size:0.84rem"><input type="checkbox" id="dupOnlyRisk"> 사용 중인 레코드가 2개 이상인 그룹만</label>
                        <span class="dim" id="dupSummary" style="font-size:0.85rem;color:var(--text-dim)"></span>
                    </div>
                </div>

                <div id="dupBody"></div>
            </div>
        </main>
    </div>

    <script src="../js/config.js"></script>
    <script src="js/admin-common.js"></script>
    <script src="js/version.js"></script>
    <script src="js/admin-auth.js"></script>
    <script src="js/masters.js"></script>
    <script src="js/speaker-dupes.js"></script>
</body>
</html>
