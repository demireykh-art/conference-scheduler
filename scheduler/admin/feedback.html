<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/asls-logo.png">
    <title>인기 강의 (설문 집계) · ASLS 행사 관리</title>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <div id="sidebarMount"></div>

        <main class="main">
            <div class="main-topbar">
                <div style="display:flex;align-items:center;gap:10px">
                    <button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
                    <div>
                        <h1 class="main-title">인기 강의 · 설문 집계</h1>
                        <div id="confSwitcher" class="conf-switcher"></div>
                    </div>
                </div>
                <div style="display:flex;gap:8px">
                    <button class="btn" onclick="gotoTimetable()">🗓️ 시간표로</button>
                </div>
            </div>

            <div class="main-body">
                <a href="index.html" style="font-size:0.85rem;color:var(--primary);text-decoration:none">‹ 행사 목록으로</a>

                <div class="info-banner" style="margin-top:10px">
                    <div class="info-ico">i</div>
                    <div class="info-title">학술대회 종료 후 참석자가 <b>좋았던 강의</b>에 추천한 수를 집계합니다. 가장 많은 추천을 받은 강의가 인기 강의입니다.
                        각 룸의 <b>첫 강의가 유리한 자리 편향</b>을 감안할 수 있도록, 그 강의가 룸에서 <b>몇 번째 시간대</b>였는지와 <b>순번별 평균 추천</b>을 함께 보여줍니다.</div>
                </div>

                <div class="fb-toolbar">
                    <div class="seg" id="modeSeg">
                        <button data-mode="view" onclick="setMode('view')">🏆 순위 보기</button>
                        <button data-mode="input" onclick="setMode('input')">✏️ 추천수 입력</button>
                    </div>
                    <div class="seg" id="rankSeg">
                        <button data-rank="votes" onclick="setRank('votes')">추천수순</button>
                        <button data-rank="adj" onclick="setRank('adj')" title="같은 순번(자리) 평균 대비 얼마나 더 추천받았는지 — 자리 편향을 보정한 순위">순번보정순</button>
                    </div>
                    <input type="text" id="fbSearch" placeholder="🔍 제목·연자·소속·회사·제품 검색" autocomplete="off"
                        style="padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:0.86rem;width:240px">
                    <span class="fb-summary" id="fbSummary"></span>
                </div>

                <div id="fbBody"></div>
            </div>
        </main>
    </div>

    <script src="../js/config.js"></script>
    <script src="js/admin-common.js"></script>
    <script src="js/version.js"></script>
    <script src="js/admin-auth.js"></script>
    <script src="js/masters.js"></script>
    <script src="js/feedback.js"></script>
</body>
</html>
