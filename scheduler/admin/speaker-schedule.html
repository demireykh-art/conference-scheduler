<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연자별 강의 일정 · ASLS 행사 관리</title>
    <link rel="icon" type="image/png" href="assets/asls-logo.png">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <div id="sidebarMount"></div>
        <main class="main">
            <div class="main-topbar">
                <div style="display:flex;align-items:center;gap:10px">
                    <button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
                    <div>
                        <h1 class="main-title">연자별 강의 일정</h1>
                        <div id="confName" style="font-size:0.82rem;color:var(--text-dim);margin-top:2px"></div>
                    </div>
                </div>
            </div>
            <div class="main-body">
                <div class="info-banner">
                    <div class="info-ico">i</div>
                    <div class="info-title">전체 연자의 강의·좌장/사회 일정을 날짜별로 모아 봅니다. 검색(연자/제목/회사)·중복(시간겹침) 점검이 가능하며, 시간표의 모든 강의가 빠짐없이 표시됩니다.</div>
                </div>

                <div class="ss-bar">
                    <span class="ss-bar-label">행사 선택</span>
                    <select id="ssConfSelect" onchange="changeConf(this.value)"></select>
                    <span class="ss-bar-label" style="margin-left:6px">검색</span>
                    <select id="ssField" onchange="onFieldChange(this.value)">
                        <option value="all">전체</option>
                        <option value="name">연자</option>
                        <option value="title">제목</option>
                        <option value="company">회사(소속)</option>
                    </select>
                    <input type="text" id="ssSearch" placeholder="🔍 검색어 입력" oninput="onSearch(this.value)">
                    <button class="btn btn-sm" title="연자별 일정 전체를 ChatGPT 검증용 텍스트로 복사합니다(강의 누락·중복 오류 점검용)" onclick="copyVerify()" style="margin-left:auto">🤖 GPT 더블체크용 복사</button>
                </div>

                <div id="ssDays" class="ss-days"></div>
                <div id="ssSummary" class="ss-summary"></div>
                <div id="ssConfBar" class="ss-confbar"></div>
                <div id="ssList"></div>
            </div>
        </main>
    </div>
    <div id="ssFab" class="ss-fab"></div>

    <script src="../js/config.js"></script>
    <script src="js/admin-common.js"></script>
    <script src="js/version.js"></script>
    <script src="js/admin-auth.js"></script>
    <script src="js/masters.js"></script>
    <script src="js/speaker-schedule.js"></script>
</body>
</html>
